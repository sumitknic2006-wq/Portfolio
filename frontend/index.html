<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Primary SEO Metadata -->
    <title>Sumit Kumar | Full-Stack Developer &amp;  Data Science Engineer</title>
    <meta name="description" content="Portfolio of Sumit Kumar, Full-Stack Developer &amp; Computer Science student at SAGE University, Indore. Specializing in React, Node.js, Express, MongoDB, and DSA in C++." />
    <meta name="keywords" content="Sumit Kumar, Developer Portfolio, Full-Stack Developer, MERN, React, Node.js, Express, MongoDB, C++, DSA, SAGE University" />
    <meta name="author" content="Sumit Kumar" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sumit Kumar | Full-Stack Developer Portfolio" />
    <meta property="og:description" content="Explore projects, technical skills, DSA solutions in C++, and developer journey of Sumit Kumar." />
    <meta property="og:site_name" content="Sumit Kumar Portfolio" />
    <meta property="og:image" content="/images/sumit.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sumit Kumar | Full-Stack Developer Portfolio" />
    <meta name="twitter:description" content="Full-Stack Developer (MERN) & DSA in C++ enthusiast at SAGE University, Indore." />
    <meta name="twitter:image" content="/images/sumit.png" />
    <meta name="twitter:creator" content="@Sumitkumar95862" />
    
    <!-- Theme & Display -->
    <meta name="theme-color" content="#0b1120" />
    
    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Anti-flicker theme initialization -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.classList.add(theme);
          document.documentElement.classList.remove(theme === 'dark' ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/20 selection:text-cyan-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
