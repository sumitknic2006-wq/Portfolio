<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d17" />
      <stop offset="100%" stop-color="#0b1324" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="16" />
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#1e2e4f" stroke-width="2" rx="15" />

  <!-- Title Badge -->
  <rect x="40" y="35" width="220" height="34" rx="8" fill="#0d182e" stroke="#1e2e4f" />
  <circle cx="56" cy="52" r="5" fill="#06b6d4" />
  <text x="70" y="57" fill="#06b6d4" font-family="monospace" font-size="14" font-weight="bold">RESTIFY ARCHITECTURE</text>

  <!-- Status tag -->
  <rect x="620" y="35" width="140" height="30" rx="6" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" />
  <text x="690" y="55" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">VERIFIED LIVE</text>

  <!-- Client Side Panel -->
  <rect x="40" y="100" width="210" height="290" rx="12" fill="#0d182e" stroke="#1e2e4f" />
  <rect x="55" y="115" width="180" height="26" rx="6" fill="#13223f" />
  <text x="145" y="132" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Frontend (Vercel Edge)</text>
  
  <rect x="55" y="155" width="180" height="60" rx="6" fill="#070d17" stroke="#1e2e4f" />
  <text x="68" y="177" fill="#38bdf8" font-family="monospace" font-size="11">React 19 Dashboard</text>
  <text x="68" y="197" fill="#94a3b8" font-family="sans-serif" font-size="11">Focus Timer &amp; Telemetry</text>

  <rect x="55" y="230" width="180" height="60" rx="6" fill="#070d17" stroke="#1e2e4f" />
  <text x="68" y="252" fill="#38bdf8" font-family="monospace" font-size="11">Client State Buffers</text>
  <text x="68" y="272" fill="#94a3b8" font-family="sans-serif" font-size="11">Batch Sync Engine</text>

  <rect x="55" y="305" width="180" height="60" rx="6" fill="#070d17" stroke="#1e2e4f" />
  <text x="68" y="327" fill="#38bdf8" font-family="monospace" font-size="11">Tailwind CSS + Icons</text>
  <text x="68" y="347" fill="#94a3b8" font-family="sans-serif" font-size="11">Responsive Dark UI</text>

  <!-- Connector Line 1 -->
  <path d="M 250 245 L 300 245" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="300,245 292,240 292,250" fill="#06b6d4" />
  <text x="275" y="235" fill="#06b6d4" font-family="monospace" font-size="10" text-anchor="middle">HTTPS</text>

  <!-- Server Panel -->
  <rect x="300" y="100" width="210" height="290" rx="12" fill="#0d182e" stroke="#06b6d4" filter="url(#glow)" stroke-opacity="0.6" />
  <rect x="315" y="115" width="180" height="26" rx="6" fill="#13223f" />
  <text x="405" y="132" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">REST Service (Render)</text>

  <rect x="315" y="155" width="180" height="60" rx="6" fill="#070d17" stroke="#1e2e4f" />
  <text x="328" y="177" fill="#38bdf8" font-family="monospace" font-size="11">Express.js API Router</text>
  <text x="328" y="197" fill="#94a3b8" font-family="sans-serif" font-size="11">RESTful /api/v1 Routes</text>

  <rect x="315" y="230" width="180" height="60" rx="6" fill="#070d17" stroke="#1e2e4f" />
  <text x="328" y="252" fill="#38bdf8" font-family="monospace" font-size="11">CORS &amp; Middleware</text>
  <text x="328" y="272" fill="#94a3b8" font-family="sans-serif" font-size="11">Payload Validation</text>

  <rect x="315" y="305" width="180" height="60" rx="6" fill="#070d17" stroke="#1e2e4f" />
  <text x="328" y="327" fill="#38bdf8" font-family="monospace" font-size="11">Mongoose Connector</text>
  <text x="328" y="347" fill="#94a3b8" font-family="sans-serif" font-size="11">Resilient Failover</text>

  <!-- Connector Line 2 -->
  <path d="M 510 245 L 560 245" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="560,245 552,240 552,250" fill="#3b82f6" />
  <text x="535" y="235" fill="#3b82f6" font-family="monospace" font-size="10" text-anchor="middle">TCP/TLS</text>

  <!-- Database Panel -->
  <rect x="560" y="100" width="200" height="290" rx="12" fill="#0d182e" stroke="#1e2e4f" />
  <rect x="575" y="115" width="170" height="26" rx="6" fill="#13223f" />
  <text x="660" y="132" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Database (Atlas)</text>

  <rect x="575" y="160" width="170" height="65" rx="6" fill="#070d17" stroke="#1e2e4f" />
  <text x="588" y="185" fill="#10b981" font-family="monospace" font-size="12">Collections</text>
  <text x="588" y="205" fill="#94a3b8" font-family="sans-serif" font-size="11">&bull; sessions &bull; metrics</text>

  <rect x="575" y="245" width="170" height="110" rx="6" fill="#070d17" stroke="#1e2e4f" />
  <text x="588" y="270" fill="#10b981" font-family="monospace" font-size="12">Health Checks</text>
  <text x="588" y="292" fill="#94a3b8" font-family="sans-serif" font-size="11">Connection Pools</text>
  <text x="588" y="312" fill="#94a3b8" font-family="sans-serif" font-size="11">Auto-reconnect logic</text>
  <text x="588" y="332" fill="#94a3b8" font-family="sans-serif" font-size="11">24/7 Monitoring</text>
</svg>
